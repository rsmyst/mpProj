[project]
name = "reap"
version = "0.1.0"
description = "R.E.A.P : Realtime Edge Agentic Physio-Buddy — hybrid MediaPipe + YOLO-Pose kinematic pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mediapipe>=1.0",
  "ultralytics>=8.2",
  "opencv-python>=4.8",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local neural TTS: Phonon-31M (Gradium) plus Piper fallback.
# The demo still works without this extra by falling back to espeak-ng.
voice = [
  "ptts>=0.6",
  "piper-tts>=1.8",
]

[project.scripts]
reap-bench = "reap.apps.bench_pose:main"
reap-demo = "reap.apps.demo_server:main"
reap-speak = "reap.audio.tts:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reap"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
