# REAP default config — Sept milestone: Tracking Model Integration
camera:
  source: 0            # 0 = webcam, or path to video.mp4 / rtsp://...
  width: 640
  height: 480
  mirror: false        # true = selfie view
  loop: false          # loop video files

mediapipe:
  model_complexity: 1  # 0=fast, 1=balanced, 2=accurate
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

yolo:
  weights: "yolov8n-pose.pt"
  imgsz: 640
  conf: 0.5
  device: "cpu"        # set "cuda" / "0" on GPU edge boards later

hybrid:
  mode: "hybrid"       # mp | yolo | hybrid
  mp_conf_threshold: 0.5   # below this avg conf -> force YOLO fallback
  validate_every_n: 15     # run YOLO as validator every N frames
  fusion: "confidence_weighted"

bench:
  save_csv: ""         # e.g. "run.csv" to log per-frame latency
  show_angles: true

# Oct milestone (done): Core Framework — guided workout session
session:
  exercise: "chair_stand"  # chair_stand | squat | leg_raise
  min_amplitude: 20.0      # smallest bend (deg) that counts as a rep
  min_gap: 10              # min frames between reps
  stand_threshold: 150.0   # knee angle above this = standing upright

# Nov milestone (starter ~30%): Edge AI Setup — lightweight on-device mode
edge:
  profile: "balanced"      # balanced | low_power
  low_power_width: 320
  low_power_height: 240
  run_every_n: 1           # 2 = process every other frame on slow devices
  budget_ms: 100.0         # warn if a frame takes longer than this

# Local voice I/O — zero cloud at runtime once weights are cached
audio:
  tts: "auto"              # auto | phonon | piper | espeak | none
  phonon_model: "hf://gradium/phonon-31m-en"
  phonon_voice: "Pippa"    # British female; empty = model's own default
  phonon_lang: "en"
  phonon_quant: "q8"       # q8 (~65 MB) | q6k | q4k | f32
  phonon_device: "cpu"     # cpu
  phonon_voice_catalog: "" # optional custom catalog; empty = Gradium default
  piper_model: ""          # fallback Piper voice, e.g. "models/en_US-amy-low.onnx"
  espeak_voice: "en"
  espeak_speed: 165
  cue_gap_s: 1.2           # do not repeat corrective cues faster than this
  auto_cues: false         # demo speaks only when a button is clicked

# Live demo server
demo:
  host: "127.0.0.1"
  port: 8000
  stick_only: false        # true = black background, skeleton only
  jpeg_quality: 80
